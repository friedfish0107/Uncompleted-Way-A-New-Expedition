base {
    archivesName = mod_id
}
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
ext{

}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
//sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories{
    maven{url = "https://code.redspace.io/releases"}
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.kosmx.dev/" }
    maven { url = "https://maven.enginehub.org/repo/" }
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}
dependencies {
    //未尽系列依赖
    runtimeOnly project(":almost_one_attribute")
    compileOnly project(":almost_one_attribute")

    runtimeOnly project(":uncompleted_way_spellbook")
    compileOnly project(":uncompleted_way_spellbook")
    //铁魔法依赖
    compileOnly "io.redspace:irons_spellbooks:${irons_spellbook_version}"
    //思索库依赖
    compileOnly("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_version")
    runtimeOnly("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_version")
    //Curio库依赖
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    //神话属性依赖
    //compileOnly "curse.maven:mythic-attributes-${mythic_attributes_id}"
}

